plugins {
    id "architectury-plugin" version "3.5.166"
    id "dev.architectury.loom" version "1.14.473" apply false
    id "com.gradleup.shadow" version "9.4.1" apply false
    id "idea"
}

tasks.named("wrapper", Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    plugins.withId("dev.architectury.loom") {
        loom {
            silentMojangMappingsLicense()
        }

        dependencies {
            minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
            mappings loom.officialMojangMappings()
        }
    }
}

allprojects {
    apply plugin: "java-library"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    group = rootProject.mod_group_id
    version = rootProject.mod_version

    base {
        archivesName = rootProject.mod_id
    }

    def useLocalToucanLib = providers.gradleProperty("useLocalToucanLib")
            .map { it.toBoolean() }
            .orElse(false)
            .get()

    repositories {
        maven {
            name = "CurseForge"
            url = uri("https://minecraft.curseforge.com/api/maven/")
            metadataSources {
                artifact()
            }
        }
        if (useLocalToucanLib) {
            mavenLocal()
        }
        maven {
            name = "Modrinth"
            url = uri("https://api.modrinth.com/maven")
            content {
                includeGroup "maven.modrinth"
            }
        }
        maven {
            name = "CurseMaven"
            url = uri("https://cursemaven.com")
            content {
                includeGroup "curse.maven"
            }
        }
        mavenCentral()
        maven { url = uri("https://maven.architectury.dev/") }
        maven { url = uri("https://maven.fabricmc.net/") }
        maven { url = uri("https://maven.terraformersmc.com/") }
        maven { url = uri("https://maven.ladysnake.org/releases") }
        maven { url = uri("https://maven.neoforged.net/releases/") }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 21
    }

    publishing {
        repositories {
            maven {
                url = uri("${rootProject.projectDir}/repo")
            }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
