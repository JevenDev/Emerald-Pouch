ext.set("loom.platform", "fabric")
apply plugin: "dev.architectury.loom"

architectury {
    common(rootProject.enabled_platforms.split(","))
}

sourceSets.main.resources {
    srcDir("src/generated/resources")
    exclude("**/*.bbmodel")
    exclude("**/.cache/**")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"
    if (rootProject.useLocalToucanLib.toBoolean()) {
        modCompileOnly "com.jvn.toucanlib:toucanlib-fabric-${rootProject.minecraft_version}:${rootProject.toucanlib_version}"
    } else {
        modCompileOnly "maven.modrinth:${rootProject.toucanlib_modrinth_slug}:${rootProject.toucanlib_fabric_version}"
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.mod_id
            from components.java
        }
    }
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test", Test) {
    useJUnitPlatform()
    maxParallelForks = 1
    workingDir layout.buildDirectory.dir("test-run")
    systemProperty "pouch.projectDir", projectDir.absolutePath
    doFirst { workingDir.mkdirs() }
}
