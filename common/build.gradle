ext.set("loom.platform", "fabric")
apply plugin: "dev.architectury.loom"

architectury {
    common(rootProject.enabled_platforms.split(","))
}

sourceSets.main.resources {
    srcDir("src/generated/resources")
    exclude("**/*.bbmodel")
    exclude("**/.cache/**")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"
    if (rootProject.hasProperty("useLocalToucanLib") && rootProject.useLocalToucanLib.toBoolean()) {
        modCompileOnly "com.jvn.toucanlib:toucanlib-fabric-${rootProject.minecraft_version}:${rootProject.toucanlib_version}"
    } else {
        modCompileOnly rootProject.toucanlib_modrinth_fabric_coordinate
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.mod_id
            from components.java
        }
    }
}
